name: Runtime contracts
on:
  push:
    branches: [main, 'impl/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  moonbit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Bootstrap and validate the pinned toolchain
        shell: bash
        env:
          # Immutable pins verified before execution; upstream versioned
          # objects expire after ~60 days, so a mismatch fails loudly and the
          # pin must be re-recorded deliberately rather than drifting.
          MOONBIT_VERSION: '0.10.15+943464bfa'
          MOONBIT_INSTALLER_SHA256: '46495f8cdc0050f79b6cb195d66478d101cb3601d68506568fbe377fcdf2a9fe'
          MOON_SHA256: 'a31026b83410607909ebae469fa19e46c32201cfe403be6099e1da961a5ebf0f'
          MOONC_SHA256: 'fb950cbc125168c49523ef554d2649effd66499c596dafcb15c80b561d45fd8c'
          MOONRUN_SHA256: 'ba44070aa78d89c2c6da6524d2aa782e46b18cb4a42dd31cd13bf588107089cf'
        run: |
          set -euo pipefail
          mkdir -p evidence
          curl --fail --silent --show-error --location https://cli.moonbitlang.com/install/unix.sh -o "$RUNNER_TEMP/install-moon.sh"
          echo "$MOONBIT_INSTALLER_SHA256  $RUNNER_TEMP/install-moon.sh" | sha256sum --check | tee evidence/installer-sha256.txt
          bash "$RUNNER_TEMP/install-moon.sh" "$MOONBIT_VERSION"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          {
            echo "$MOON_SHA256  $HOME/.moon/bin/moon"
            echo "$MOONC_SHA256  $HOME/.moon/bin/moonc"
            echo "$MOONRUN_SHA256  $HOME/.moon/bin/moonrun"
          } | sha256sum --check | tee evidence/toolchain-sha256.txt
          "$HOME/.moon/bin/moon" version --all | tee evidence/moon-version.txt
          grep -Fq 'moonc v0.10.15+943464bfa (2026-10-12)' evidence/moon-version.txt
          grep -Fq 'moon 0.1.20261012 (748b63c 2026-10-12)' evidence/moon-version.txt
          node --version | tee evidence/node-version.txt
          uname -a | tee evidence/environment.txt
      - name: Check MoonBit JS
        run: moon check --target js
      - name: Test MoonBit JS
        shell: bash
        run: moon test --target js 2>&1 | tee evidence/moon-js.log
      - name: Test MoonBit native
        shell: bash
        run: moon test --target native 2>&1 | tee evidence/moon-native.log
      - name: Build compiled core and native control channel
        run: |
          npm run build
          git rev-parse HEAD > evidence/source-revision.txt
          git archive --format=tar HEAD -o evidence/test-source.tar
      - name: Test complete Node boundary
        shell: bash
        run: npm test 2>&1 | tee evidence/node-tests.log
      - name: Verify queue-inclusive load deadlines and worker interrupt on Linux
        shell: bash
        run: |
          node scripts/m1-load-deadline.cjs 2>&1 | tee evidence/m1-load-deadline.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compiled-core
          path: dist/core.cjs
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: linux-evidence
          path: evidence/
          if-no-files-found: error
  linux-native:
    needs: moonbit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Install GTK/WebKitGTK and a headless display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev xvfb xauth dbus-x11 libgl1-mesa-dri
      - name: Bootstrap and validate the pinned toolchain
        shell: bash
        env:
          MOONBIT_VERSION: '0.10.15+943464bfa'
          MOONBIT_INSTALLER_SHA256: '46495f8cdc0050f79b6cb195d66478d101cb3601d68506568fbe377fcdf2a9fe'
          MOON_SHA256: 'a31026b83410607909ebae469fa19e46c32201cfe403be6099e1da961a5ebf0f'
          MOONC_SHA256: 'fb950cbc125168c49523ef554d2649effd66499c596dafcb15c80b561d45fd8c'
          MOONRUN_SHA256: 'ba44070aa78d89c2c6da6524d2aa782e46b18cb4a42dd31cd13bf588107089cf'
        run: |
          set -euo pipefail
          mkdir -p evidence
          curl --fail --silent --show-error --location https://cli.moonbitlang.com/install/unix.sh -o "$RUNNER_TEMP/install-moon.sh"
          echo "$MOONBIT_INSTALLER_SHA256  $RUNNER_TEMP/install-moon.sh" | sha256sum --check | tee evidence/installer-sha256.txt
          bash "$RUNNER_TEMP/install-moon.sh" "$MOONBIT_VERSION"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          {
            echo "$MOON_SHA256  $HOME/.moon/bin/moon"
            echo "$MOONC_SHA256  $HOME/.moon/bin/moonc"
            echo "$MOONRUN_SHA256  $HOME/.moon/bin/moonrun"
          } | sha256sum --check | tee evidence/toolchain-sha256.txt
          "$HOME/.moon/bin/moon" version --all | tee evidence/moon-version.txt
          grep -Fq 'moonc v0.10.15+943464bfa (2026-10-12)' evidence/moon-version.txt
          grep -Fq 'moon 0.1.20261012 (748b63c 2026-10-12)' evidence/moon-version.txt
      - name: Build the Linux GTK/WebKitGTK host
        shell: bash
        run: node scripts/build-linux-host.cjs 2>&1 | tee evidence/linux-host-build.log
      - name: Build the Node-less runtime
        run: moon build --target native cmd/emoon
      - name: Reject non-canonical control frames
        shell: bash
        run: node --test tests/linux-host-frame.test.cjs 2>&1 | tee evidence/linux-host-frame.log
      - name: Run the shared Node-less window/adapted fixtures on Linux
        shell: bash
        env:
          ELECTRON_MBT_REQUIRE_NATIVE_HOST: '1'
          ELECTRON_MBT_ISOLATED_DISPLAY: '1'
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
          GDK_BACKEND: 'x11'
        run: |
          dbus-run-session -- xvfb-run -a -s "-screen 0 1280x1024x24" \
            node --test tests/nodeless-runtime.test.cjs 2>&1 | tee evidence/linux-native.log
      - name: Run native emoon CLI parity on Linux
        shell: bash
        env:
          ELECTRON_MBT_REQUIRE_NATIVE_HOST: '1'
          ELECTRON_MBT_ISOLATED_DISPLAY: '1'
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
          GDK_BACKEND: 'x11'
        run: |
          dbus-run-session -- xvfb-run -a -s "-screen 0 1280x1024x24" \
            node --test tests/emoon-cli-parity.test.cjs 2>&1 | tee evidence/emoon-parity.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: linux-native-evidence
          path: evidence/
          if-no-files-found: error
  macos:
    needs: moonbit
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: compiled-core
          path: dist/
      - name: Bootstrap and validate the pinned toolchain
        shell: bash
        env:
          # The Node boundary builds cmd/emoon with `moon build`, so this
          # job needs the toolchain too. The installer resolves platform-specific
          # artifacts, so the linux-x86_64 hashes in the moonbit job do not apply
          # here; these were recorded from the darwin-aarch64 artifact of the
          # same version. A mismatch fails loudly instead of drifting.
          MOONBIT_VERSION: '0.10.15+943464bfa'
          MOONBIT_INSTALLER_SHA256: '46495f8cdc0050f79b6cb195d66478d101cb3601d68506568fbe377fcdf2a9fe'
          MOON_SHA256: '3285bcd630ad68dbec7c74f308d30c5e8af9503b0e4c0ed95a3719e873c35b33'
          MOONC_SHA256: '60d8e33110ab7a013a3f23da2013152da64c5f1a9d4c12ca469eec77677160d3'
          MOONRUN_SHA256: '91f36ac0a5b3c94fd922ceddb4dcb2c1f7622b7157ebd464c6cb8e9e56965a97'
        run: |
          set -euo pipefail
          mkdir -p evidence
          curl --fail --silent --show-error --location https://cli.moonbitlang.com/install/unix.sh -o "$RUNNER_TEMP/install-moon.sh"
          echo "$MOONBIT_INSTALLER_SHA256  $RUNNER_TEMP/install-moon.sh" | shasum -a 256 -c | tee evidence/installer-sha256.txt
          bash "$RUNNER_TEMP/install-moon.sh" "$MOONBIT_VERSION"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          {
            echo "$MOON_SHA256  $HOME/.moon/bin/moon"
            echo "$MOONC_SHA256  $HOME/.moon/bin/moonc"
            echo "$MOONRUN_SHA256  $HOME/.moon/bin/moonrun"
          } | shasum -a 256 -c | tee evidence/toolchain-sha256.txt
          "$HOME/.moon/bin/moon" version --all | tee evidence/moon-version.txt
          grep -Fq 'moonc v0.10.15+943464bfa (2026-10-12)' evidence/moon-version.txt
          grep -Fq 'moon 0.1.20261012 (748b63c 2026-10-12)' evidence/moon-version.txt
      - name: Build macOS native control channel
        run: node scripts/build-native.cjs
      - name: Build standalone macOS AppKit WebView host
        run: node scripts/build-macos-host.cjs
      - name: Build native CLI for Apple Silicon acceptance
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          node scripts/build-cli.cjs 2>&1 | tee evidence/emoon-build.log
          shasum -a 256 dist/emoon dist/emoon-host | tee evidence/emoon-binary-sha256.txt
      - name: Check out pinned Moji 1.0.7 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: alexishida/Moji
          ref: b9753c0f7d3fe41d975a1231517f4f124b0a4408
          path: .ci-moji
          persist-credentials: false
      - name: Build pinned Moji without install scripts
        shell: bash
        run: |
          set -euo pipefail
          git -C .ci-moji rev-parse HEAD | tee evidence/moji-source-revision.txt
          test "$(cat evidence/moji-source-revision.txt)" = b9753c0f7d3fe41d975a1231517f4f124b0a4408
          shasum -a 256 .ci-moji/package-lock.json | tee evidence/moji-lock-sha256.txt
          npm --prefix .ci-moji ci --ignore-scripts --no-audit --no-fund 2>&1 | tee evidence/moji-install.log
          npm --prefix .ci-moji run build 2>&1 | tee evidence/moji-build.log
      - name: Exercise native emoon and WKWebView on Apple Silicon
        shell: bash
        env:
          EMOON_MOJI_ROOT: ${{ github.workspace }}/.ci-moji
          EMOON_EVIDENCE_DIR: ${{ github.workspace }}/evidence/emoon-macos
        run: |
          set -euo pipefail
          node --test scripts/emoon-macos-acceptance.cjs 2>&1 | tee evidence/emoon-macos-tests.log
      - name: Test complete Node boundary on macOS
        shell: bash
        run: |
          mkdir -p evidence
          npm test 2>&1 | tee evidence/node-tests.log
      - name: Verify queue-inclusive load deadlines and worker interrupt on macOS
        shell: bash
        run: |
          node scripts/m1-load-deadline.cjs 2>&1 | tee evidence/m1-load-deadline.log
      - name: Probe actual WKContentWorld observations
        env:
          # The runner pasteboard is disposable, so the real Cmd+V/general
          # pasteboard path is exercised here; local runs stay opt-in gated.
          ELECTRON_MBT_OS_PASTE_OPT_IN: '1'
        run: node scripts/macos-probe.cjs
      - name: Measure M0 isolated-world synchronous bridge feasibility without claiming compatibility
        shell: bash
        run: |
          set -euo pipefail
          node scripts/m0-bridge-probe.cjs 2>&1 | tee evidence/m0-bridge-probe.log
      - name: Smoke-test real AppKit WKWebView host lifecycle
        shell: bash
        run: |
          node scripts/m1-macos-smoke.cjs 2>&1 | tee evidence/native-host-smoke.log
      - name: Reject malformed raw native control IDs before dispatch
        shell: bash
        run: |
          node scripts/m1-invalid-wire.cjs 2>&1 | tee evidence/m1-invalid-wire.log
      - name: Exercise experimental unchanged CJS Electron app
        shell: bash
        run: |
          node scripts/m1-app-smoke.cjs 2>&1 | tee evidence/m1-cjs-app.log
      - name: Verify native constructor rollback and orphan-free worker fault
        shell: bash
        run: |
          node scripts/m1-host-init-fault.cjs 2>&1 | tee evidence/m1-host-init-fault.log
      - name: Verify asynchronous spawn errors and host-loss propagation
        shell: bash
        run: |
          node scripts/m1-host-loss.cjs 2>&1 | tee evidence/m1-host-loss.log
      - name: Verify load event reentrancy and failure retry
        shell: bash
        run: |
          node scripts/m1-load-event-chain.cjs 2>&1 | tee evidence/m1-load-event-chain.log
      - name: Fail closed on native begin-load generation divergence
        shell: bash
        run: |
          node scripts/m1-begin-load-failure.cjs 2>&1 | tee evidence/m1-begin-load-failure.log
      - name: Confirm slow HTML does not block the Node event loop
        shell: bash
        run: |
          node scripts/m1-slow-load.cjs 2>&1 | tee evidence/m1-slow-load.log
      - name: Build test-only retired WKNavigation callback host
        run: node scripts/build-macos-host.cjs --simulate-stale-navigation-callback
      - name: Reject retired navigation callbacks after document-generation change
        shell: bash
        run: |
          node scripts/m1-navigation-generation.cjs 2>&1 | tee evidence/m1-navigation-generation.log
      - name: Build test-only WebKit termination-callback simulator
        run: node scripts/build-macos-host.cjs --simulate-webkit-termination
      - name: Validate simulated WebKit termination notification and MoonBit revocation
        shell: bash
        run: |
          node scripts/m1-renderer-delegate-sim.cjs 2>&1 | tee evidence/m1-renderer-delegate-sim.log
      - name: Build isolated test-only real WebKit process termination host
        run: node scripts/build-macos-host.cjs --kill-real-webkit-process
      - name: Verify real WebKit content process termination and MoonBit revocation
        shell: bash
        run: |
          node scripts/m1-webkit-process-kill.cjs 2>&1 | tee evidence/m1-webkit-process-kill.log
      - name: Build test-only native AppKit close-gesture simulator
        run: node scripts/build-macos-host.cjs --simulate-native-close
      - name: Validate OS close cancellation and native ACK
        shell: bash
        run: |
          node scripts/m1-native-close.cjs 2>&1 | tee evidence/m1-native-close.log
      - name: Verify queued native close cannot fire after programmatic cancellation
        shell: bash
        run: |
          node scripts/m1-native-close-race.cjs 2>&1 | tee evidence/m1-native-close-race.log
      - name: Install the separate pinned test oracle
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/electron-oracle" --save-exact electron@44.7.0
          node "$RUNNER_TEMP/electron-oracle/node_modules/electron/install.js"
          cp "$RUNNER_TEMP/electron-oracle/package-lock.json" evidence/oracle-package-lock.json
      - name: Collect unchanged Electron baseline and compare IPC contracts
        shell: bash
        run: |
          ORACLE="$(node -e 'process.stdout.write(require(process.argv[1]))' "$RUNNER_TEMP/electron-oracle/node_modules/electron")"
          node scripts/oracle.cjs "$ORACLE"
          node scripts/ipc-listener-oracle.cjs "$ORACLE"
          node scripts/ipc-handler-oracle.cjs "$ORACLE"
      - name: Run the bounded M0 synchronous contextBridge spike
        shell: bash
        run: |
          node scripts/m0-context-bridge-probe.cjs 2>&1 | tee evidence/m0-context-bridge.log
      - name: Run the B6-C transport and B6-D semantics evidence
        shell: bash
        run: |
          ELECTRON_MBT_REQUIRE_ORACLE_BASELINE=1 \
            node --test tests/context-bridge-transport-native.test.cjs 2>&1 | \
            tee evidence/b6-context-bridge-transport.log
          node --test tests/context-bridge-semantics-native.test.cjs 2>&1 | \
            tee evidence/b6-context-bridge-semantics.log
      - name: Compare initial native outer frame against the pinned Electron oracle
        shell: bash
        run: |
          node scripts/m1-bounds-oracle.cjs 2>&1 | tee evidence/m1-bounds-oracle.log
      - name: Compare the electron.mbt observation against the baseline
        shell: bash
        run: node scripts/differential.cjs --baseline evidence/electron-baseline.json
      - name: Record macOS SDK and WebView environment
        shell: bash
        run: |
          {
            sw_vers
            xcodebuild -version
            xcodebuild -sdk macosx -version
            mdls -name kMDItemVersion /Applications/Safari.app || true
            uname -a
          } | tee evidence/macos-environment.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: macos-evidence
          path: evidence/
          if-no-files-found: error
