name: Runtime contracts
on:
  push:
    branches: [main, 'impl/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  moonbit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Bootstrap and validate the pinned toolchain
        shell: bash
        env:
          # Immutable pins verified before execution; upstream versioned
          # objects expire after ~60 days, so a mismatch fails loudly and the
          # pin must be re-recorded deliberately rather than drifting.
          MOONBIT_VERSION: '0.10.14+7d59c7ec9'
          MOONBIT_INSTALLER_SHA256: '46495f8cdc0050f79b6cb195d66478d101cb3601d68506568fbe377fcdf2a9fe'
          MOON_SHA256: '6da4919f45f4abf7c6d7f3cf8d9a457de77dca430d6fb811d21b27ae1ac8e11d'
          MOONC_SHA256: 'd163b2c4c878ca584870764b75e633d73e8b9c178dcc6b00c692f6b2a6b1b2dc'
          MOONRUN_SHA256: '1b22f489621059b8c22ee4acdaddc5f5d1781f62529d3000a24c03d45032d0e2'
        run: |
          set -euo pipefail
          mkdir -p evidence
          curl --fail --silent --show-error --location https://cli.moonbitlang.com/install/unix.sh -o "$RUNNER_TEMP/install-moon.sh"
          echo "$MOONBIT_INSTALLER_SHA256  $RUNNER_TEMP/install-moon.sh" | sha256sum --check | tee evidence/installer-sha256.txt
          bash "$RUNNER_TEMP/install-moon.sh" "$MOONBIT_VERSION"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          {
            echo "$MOON_SHA256  $HOME/.moon/bin/moon"
            echo "$MOONC_SHA256  $HOME/.moon/bin/moonc"
            echo "$MOONRUN_SHA256  $HOME/.moon/bin/moonrun"
          } | sha256sum --check | tee evidence/toolchain-sha256.txt
          "$HOME/.moon/bin/moon" version --all | tee evidence/moon-version.txt
          grep -Fq 'moonc v0.10.14+7d59c7ec9 (2026-09-18)' evidence/moon-version.txt
          grep -Fq 'moon 0.1.20260920 (914d7da 2026-09-20)' evidence/moon-version.txt
          node --version | tee evidence/node-version.txt
          uname -a | tee evidence/environment.txt
      - name: Check MoonBit JS
        run: moon check --target js
      - name: Test MoonBit JS
        shell: bash
        run: moon test --target js 2>&1 | tee evidence/moon-js.log
      - name: Test MoonBit native
        shell: bash
        run: moon test --target native 2>&1 | tee evidence/moon-native.log
      - name: Build compiled core and native control channel
        run: npm run build
      - name: Test complete Node boundary
        shell: bash
        run: npm test 2>&1 | tee evidence/node-tests.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compiled-core
          path: dist/core.cjs
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: linux-evidence
          path: evidence/
          if-no-files-found: error
  macos:
    needs: moonbit
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: compiled-core
          path: dist/
      - name: Build macOS native control channel
        run: node scripts/build-native.cjs
      - name: Test complete Node boundary on macOS
        shell: bash
        run: |
          mkdir -p evidence
          npm test 2>&1 | tee evidence/node-tests.log
      - name: Probe actual WKContentWorld observations
        run: node scripts/macos-probe.cjs
      - name: Install the separate pinned test oracle
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/electron-oracle" --save-exact electron@44.7.0
          node "$RUNNER_TEMP/electron-oracle/node_modules/electron/install.js"
          cp "$RUNNER_TEMP/electron-oracle/package-lock.json" evidence/oracle-package-lock.json
      - name: Collect unchanged Electron baseline
        shell: bash
        run: |
          ORACLE="$(node -e 'process.stdout.write(require(process.argv[1]))' "$RUNNER_TEMP/electron-oracle/node_modules/electron")"
          node scripts/oracle.cjs "$ORACLE"
      - name: Compare the electron.mbt observation against the baseline
        shell: bash
        run: node scripts/differential.cjs --baseline evidence/electron-baseline.json
      - name: Record macOS SDK and WebView environment
        shell: bash
        run: |
          {
            sw_vers
            xcodebuild -version
            xcodebuild -sdk macosx -version
            mdls -name kMDItemVersion /Applications/Safari.app || true
            uname -a
          } | tee evidence/macos-environment.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: macos-evidence
          path: evidence/
          if-no-files-found: error
