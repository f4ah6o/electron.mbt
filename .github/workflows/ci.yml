name: Runtime contracts
on:
  push:
    branches: [main, 'impl/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  moonbit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Bootstrap and validate the observed toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          curl --fail --silent --show-error --location https://cli.moonbitlang.com/install/unix.sh -o "$RUNNER_TEMP/install-moon.sh"
          bash "$RUNNER_TEMP/install-moon.sh"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          "$HOME/.moon/bin/moon" version --all | tee evidence/moon-version.txt
          grep -Fq 'moonc v0.10.14+7d59c7ec9 (2026-09-18)' evidence/moon-version.txt
          grep -Fq 'moon 0.1.20260920 (914d7da 2026-09-20)' evidence/moon-version.txt
          node --version | tee evidence/node-version.txt
          uname -a | tee evidence/environment.txt
          sha256sum "$RUNNER_TEMP/install-moon.sh" > evidence/installer-sha256.txt
      - name: Check MoonBit JS
        run: moon check --target js
      - name: Test MoonBit JS
        shell: bash
        run: moon test --target js 2>&1 | tee evidence/moon-js.log
      - name: Test MoonBit native
        shell: bash
        run: moon test --target native 2>&1 | tee evidence/moon-native.log
      - name: Build compiled core and native control channel
        run: npm run build
      - name: Test complete Node boundary
        shell: bash
        run: npm test 2>&1 | tee evidence/node-tests.log
      - name: Verify queue-inclusive load deadlines and worker interrupt on Linux
        shell: bash
        run: |
          node scripts/m1-load-deadline.cjs 2>&1 | tee evidence/m1-load-deadline.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compiled-core
          path: dist/core.cjs
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: linux-evidence
          path: evidence/
          if-no-files-found: error
  macos:
    needs: moonbit
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: compiled-core
          path: dist/
      - name: Build macOS native control channel
        run: node scripts/build-native.cjs
      - name: Build standalone macOS AppKit WebView host
        run: node scripts/build-macos-host.cjs
      - name: Test complete Node boundary on macOS
        shell: bash
        run: |
          mkdir -p evidence
          npm test 2>&1 | tee evidence/node-tests.log
      - name: Verify queue-inclusive load deadlines and worker interrupt on macOS
        shell: bash
        run: |
          node scripts/m1-load-deadline.cjs 2>&1 | tee evidence/m1-load-deadline.log
      - name: Probe actual WKContentWorld observations
        run: node scripts/macos-probe.cjs
      - name: Smoke-test real AppKit WKWebView host lifecycle
        shell: bash
        run: |
          node scripts/m1-macos-smoke.cjs 2>&1 | tee evidence/native-host-smoke.log
      - name: Reject malformed raw native control IDs before dispatch
        shell: bash
        run: |
          node scripts/m1-invalid-wire.cjs 2>&1 | tee evidence/m1-invalid-wire.log
      - name: Exercise experimental unchanged CJS Electron app
        shell: bash
        run: |
          node scripts/m1-app-smoke.cjs 2>&1 | tee evidence/m1-cjs-app.log
      - name: Verify native constructor rollback and orphan-free worker fault
        shell: bash
        run: |
          node scripts/m1-host-init-fault.cjs 2>&1 | tee evidence/m1-host-init-fault.log
      - name: Verify load event reentrancy and failure retry
        shell: bash
        run: |
          node scripts/m1-load-event-chain.cjs 2>&1 | tee evidence/m1-load-event-chain.log
      - name: Fail closed on native begin-load generation divergence
        shell: bash
        run: |
          node scripts/m1-begin-load-failure.cjs 2>&1 | tee evidence/m1-begin-load-failure.log
      - name: Confirm slow HTML does not block the Node event loop
        shell: bash
        run: |
          node scripts/m1-slow-load.cjs 2>&1 | tee evidence/m1-slow-load.log
      - name: Build test-only WebKit termination-callback simulator
        run: node scripts/build-macos-host.cjs --simulate-webkit-termination
      - name: Validate simulated WebKit termination notification and MoonBit revocation
        shell: bash
        run: |
          node scripts/m1-renderer-delegate-sim.cjs 2>&1 | tee evidence/m1-renderer-delegate-sim.log
      - name: Install the separate pinned test oracle
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/electron-oracle" --save-exact electron@44.7.0
          node "$RUNNER_TEMP/electron-oracle/node_modules/electron/install.js"
          cp "$RUNNER_TEMP/electron-oracle/package-lock.json" evidence/oracle-package-lock.json
      - name: Collect unchanged Electron baseline
        shell: bash
        run: |
          ORACLE="$(node -e 'process.stdout.write(require(process.argv[1]))' "$RUNNER_TEMP/electron-oracle/node_modules/electron")"
          node scripts/oracle.cjs "$ORACLE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: macos-evidence
          path: evidence/
          if-no-files-found: error
